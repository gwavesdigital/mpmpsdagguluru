<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HM Portal - Digital Manabadi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="not-logged-in" style="background: var(--bg-color);">

    <div class="app-container" id="app-container" style="display: flex; flex-direction: column;">
        
        <header class="app-header" style="background: transparent; box-shadow: none; border: none; padding-top: 20px;">
            <div class="header-left">
                <button class="header-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
            </div>
            <div class="header-title"></div>
            <div class="header-right"></div>
        </header>

        <main class="main-content" style="display: flex; flex-direction: column; justify-content: center; padding: 20px;">
            
            <!-- Loading View -->
            <div id="view-loading" style="text-align: center; color: var(--primary);">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <h3>Loading...</h3>
            </div>

            <!-- View 1: Setup Form (Includes PIN) -->
            <div id="view-setup" class="premium-card" style="display: none;">
                <div class="premium-card-icon" style="background: linear-gradient(135deg, #FFC107, #FF9800);">
                    <i class="fas fa-school"></i>
                </div>
                <div style="text-align: center; margin-bottom: var(--space-lg); margin-top: 10px;">
                    <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">School Setup</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">మొదటిసారి మాత్రమే (First Time Setup)</p>
                </div>

                <form id="setup-form">
                    <div class="form-group">
                        <select id="district" class="form-control" required>
                            <option value="">Select District</option>
                            <!-- AP Districts -->
                            <option value="Anakapalli">Anakapalli</option>
                            <option value="Anantapur">Anantapur</option>
                            <option value="Annamayya">Annamayya</option>
                            <option value="Bapatla">Bapatla</option>
                            <option value="Chittoor">Chittoor</option>
                            <option value="East Godavari">East Godavari</option>
                            <option value="Eluru">Eluru</option>
                            <option value="Guntur">Guntur</option>
                            <option value="Kakinada">Kakinada</option>
                            <option value="Konaseema">Konaseema</option>
                            <option value="Krishna">Krishna</option>
                            <option value="Kurnool">Kurnool</option>
                            <option value="Nandyal">Nandyal</option>
                            <option value="NTR">NTR</option>
                            <option value="Palnadu">Palnadu</option>
                            <option value="Parvathipuram Manyam">Parvathipuram Manyam</option>
                            <option value="Prakasam">Prakasam</option>
                            <option value="Sri Potti Sriramulu Nellore">Sri Potti Sriramulu Nellore</option>
                            <option value="Sri Sathya Sai">Sri Sathya Sai</option>
                            <option value="Srikakulam">Srikakulam</option>
                            <option value="Tirupati">Tirupati</option>
                            <option value="Visakhapatnam">Visakhapatnam</option>
                            <option value="Vizianagaram">Vizianagaram</option>
                            <option value="West Godavari">West Godavari</option>
                            <option value="YSR Kadapa">YSR Kadapa</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" id="mandal" class="form-control" placeholder="Mandal (మండలం)" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="village" class="form-control" placeholder="Village (గ్రామం)" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="hmName" class="form-control" placeholder="Headmaster Name (HM పేరు)" required>
                    </div>
                    
                    <div class="form-group">
                        <div class="input-group">
                            <i class="fas fa-shield-alt input-icon"></i>
                            <input type="password" id="valiassCode" class="form-control" placeholder="Valiass Secret Code" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border-color);">
                        <label class="form-label" style="font-size: 0.85rem; color: var(--primary); font-weight: 700;"><i class="fas fa-key"></i> Set Your 6-Digit PIN</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="setup-pin" class="form-control pin-input" maxlength="6" inputmode="numeric" pattern="\d*" placeholder="••••••" required>
                        </div>
                        <small style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 5px;">ప్రతిసారి లాగిన్ అవ్వడానికి ఈ పిన్ వాడాలి.</small>
                    </div>

                    <button type="submit" class="btn btn-primary btn-glow" id="setup-btn" style="margin-top: 15px; height: 52px; border-radius: 12px;">
                        Confirm & Save Setup
                    </button>
                </form>
            </div>

            <!-- View 2: Login Form -->
            <div id="view-login" class="premium-card" style="display: none;">
                <div class="premium-card-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div style="text-align: center; margin-bottom: var(--space-lg); margin-top: 10px;">
                    <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">Welcome Back</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">Headmaster Login (ప్రిన్సిపాల్ లాగిన్)</p>
                </div>
                <form id="hm-login-form">
                    <div class="form-group">
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="hm-pin" class="form-control pin-input" maxlength="6" inputmode="numeric" pattern="\d*" placeholder="••••••" required>
                            <button type="button" class="toggle-pin-btn" onclick="togglePinVisibility()">
                                <i class="fas fa-eye" id="pin-eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-glow" id="login-btn" style="margin-top: 10px; height: 52px; border-radius: 12px;">
                        <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Login
                    </button>
                </form>
            </div>

        </main>

        <footer id="app-footer" class="app-footer" style="background: transparent; border: none;"></footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script>
        UI.initLayout();
        document.getElementById('app-container').style.display = 'flex'; 

        const viewLoading = document.getElementById('view-loading');
        const viewSetup = document.getElementById('view-setup');
        const viewLogin = document.getElementById('view-login');

        // పిన్ కనిపించేలా చేసే ఫంక్షన్
        function togglePinVisibility() {
            const pinInput = document.getElementById('hm-pin');
            const eyeIcon = document.getElementById('pin-eye-icon');
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pinInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // 1. పేజీ లోడ్ అయినప్పుడు సెటప్ ఉందా లేదా చెక్ చేయడం
        async function checkSchoolStatus() {
            try {
                const doc = await db.collection('schoolInfo').doc('main').get();
                viewLoading.style.display = 'none';

                if (doc.exists && doc.data().isSetupComplete && doc.data().hmPin) {
                    // సెటప్ మరియు పిన్ రెండూ ఉన్నాయి -> లాగిన్ చూపించు
                    viewLogin.style.display = 'block'; 
                } else {
                    // ఫస్ట్ టైమ్ లేదా పిన్ లేదు -> సెటప్ చూపించు
                    viewSetup.style.display = 'block'; 
                }
            } catch (error) {
                viewLoading.innerHTML = `<p style="color:red;">Error connecting. Check internet.</p>`;
            }
        }
        checkSchoolStatus();

        // 2. సెటప్ మరియు పిన్ సేవ్ చేసే ఫారం
        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('setup-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const secretCode = document.getElementById('valiassCode').value.trim();
            const setupPin = document.getElementById('setup-pin').value.trim();
            
            // వాల్యూ సీక్రెట్ కోడ్ చెక్
            if (secretCode !== '@533340') {
                alert("❌ తప్పు వాల్యూ సీక్రెట్ కోడ్! దయచేసి వాల్యూ టీమ్ ని సంప్రదించండి.");
                btn.innerHTML = 'Confirm & Save Setup';
                btn.disabled = false;
                return;
            }

            // పిన్ 6 డిజిట్స్ ఉందా అని చెక్
            if (setupPin.length !== 6) {
                alert("❌ పిన్ తప్పనిసరిగా 6 అంకెలు ఉండాలి!");
                btn.innerHTML = 'Confirm & Save Setup';
                btn.disabled = false;
                return;
            }

            const schoolData = {
                district: document.getElementById('district').value,
                mandal: document.getElementById('mandal').value,
                village: document.getElementById('village').value,
                schoolName: "MP MPS Dagguluru",
                hmName: document.getElementById('hmName').value,
                valiassCode: secretCode,
                isSetupComplete: true,
                hmPin: setupPin, // 👈 పిన్ ని ఇక్కడే సేవ్ చేస్తున్నాం
                sections: { teacher: false, cook: false, parent: false, office: false },
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // డేటాబేస్ లో సేవ్ చేయడం
                await db.collection('schoolInfo').doc('main').set(schoolData);
                
                // సక్సెస్ మెసేజ్
                alert("✅ Setup Successful! Please login with your new PIN.");
                
                // సెటప్ స్క్రీన్ ని దాచి, లాగిన్ స్క్రీన్ చూపించడం
                viewSetup.style.display = 'none';
                viewLogin.style.display = 'block'; 
                
            } catch (error) {
                alert("❌ Setup Failed: " + error.message);
                btn.innerHTML = 'Confirm & Save Setup';
                btn.disabled = false;
            }
        });

        // 3. లాగిన్ ఫారం
        document.getElementById('hm-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pin = document.getElementById('hm-pin').value;
            const btn = document.getElementById('login-btn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            btn.disabled = true;

            const result = await Auth.loginHM(pin);

            if (result.success) {
                alert("✅ " + result.message);
                window.location.href = 'hm-dashboard.html'; // డాష్‌బోర్డ్ కి వెళ్తుంది
            } else {
                alert("❌ " + result.message);
                btn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Login';
                btn.disabled = false;
                document.getElementById('hm-pin').value = '';
            }
        });
    </script>
</body>
</html>
