<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HM Portal - Digital Manabadi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        /* Dots Indicator CSS */
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .pin-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: background-color 0.3s;
        }
        .pin-dot.error {
            background-color: var(--danger);
        }
        .attempt-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--danger);
            font-weight: 600;
            height: 20px;
        }
    </style>
</head>
<body class="not-logged-in" style="background: var(--bg-color);">

    <div class="app-container" id="app-container" style="display: flex; flex-direction: column;">
        
        <header class="app-header" style="background: transparent; box-shadow: none; border: none; padding-top: 20px;">
            <div class="header-left">
                <button class="header-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
            </div>
            <div class="header-title"></div>
            <div class="header-right"></div>
        </header>

        <main class="main-content" style="display: flex; flex-direction: column; justify-content: center; padding: 20px;">
            
            <div id="view-loading" style="text-align: center; color: var(--primary);">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <h3>Loading...</h3>
            </div>

            <!-- View 1: Setup Form -->
            <div id="view-setup" class="premium-card" style="display: none;">
                <div class="premium-card-icon" style="background: linear-gradient(135deg, #FFC107, #FF9800);">
                    <i class="fas fa-school"></i>
                </div>
                <div style="text-align: center; margin-bottom: var(--space-lg); margin-top: 10px;">
                    <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">School Setup</h2>
                </div>

                <form id="setup-form">
                    <div class="form-group">
                        <select id="district" class="form-control" required>
                            <option value="">Select District</option>
                            <option value="Krishna">Krishna</option>
                            <option value="Guntur">Guntur</option>
                            <option value="West Godavari">West Godavari</option>
                        </select>
                    </div>
                    <div class="form-group"><input type="text" id="mandal" class="form-control" placeholder="Mandal (మండలం)" required></div>
                    <div class="form-group"><input type="text" id="village" class="form-control" placeholder="Village (గ్రామం)" required></div>
                    <div class="form-group"><input type="text" id="hmName" class="form-control" placeholder="Headmaster Name (HM పేరు)" required></div>
                    
                    <div class="form-group">
                        <div class="input-group">
                            <i class="fas fa-shield-alt input-icon"></i>
                            <input type="password" id="valiassCode" class="form-control" placeholder="Valiass Secret Code" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border-color);">
                        <label class="form-label" style="color: var(--primary); font-weight: 700;"><i class="fas fa-key"></i> Set Your 6-Digit PIN</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="setup-pin" class="form-control pin-input" maxlength="6" inputmode="numeric" pattern="\d*" placeholder="••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-glow" id="setup-btn" style="margin-top: 15px;">Confirm & Save Setup</button>
                </form>
            </div>

            <!-- View 2: Login Form -->
            <div id="view-login" class="premium-card" style="display: none;">
                <div class="premium-card-icon"><i class="fas fa-user-shield"></i></div>
                <div style="text-align: center; margin-bottom: var(--space-lg); margin-top: 10px;">
                    <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">Welcome Back</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">Headmaster Login (హెచ్‌ఎం లాగిన్)</p>
                </div>
                <form id="hm-login-form">
                    <div class="form-group">
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="hm-pin" class="form-control pin-input" maxlength="6" inputmode="numeric" pattern="\d*" placeholder="••••••" required>
                            <button type="button" class="toggle-pin-btn" onclick="togglePinVisibility('hm-pin', 'pin-eye-icon')">
                                <i class="fas fa-eye" id="pin-eye-icon"></i>
                            </button>
                        </div>
                        
                        <!-- 5 Dots and Attempts Indicator -->
                        <div class="pin-dots" id="pin-dots-container">
                            <div class="pin-dot" id="dot-1"></div>
                            <div class="pin-dot" id="dot-2"></div>
                            <div class="pin-dot" id="dot-3"></div>
                            <div class="pin-dot" id="dot-4"></div>
                            <div class="pin-dot" id="dot-5"></div>
                        </div>
                        <div class="attempt-text" id="attempt-text"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-glow" id="login-btn" style="margin-top: 10px;">Login</button>
                    
                    <div style="text-align: center; margin-top: 15px;">
                        <a href="#" onclick="showResetView()" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: none; font-weight: 600;">
                            Forgot PIN? (పిన్ మర్చిపోయారా?)
                        </a>
                    </div>
                </form>
            </div>

            <!-- View 3: Reset PIN Form -->
            <div id="view-reset" class="premium-card" style="display: none;">
                <div class="premium-card-icon" style="background: linear-gradient(135deg, #D32F2F, #B71C1C);"><i class="fas fa-unlock-alt"></i></div>
                <div style="text-align: center; margin-bottom: var(--space-lg); margin-top: 10px;">
                    <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">Reset PIN</h2>
                </div>
                
                <div style="background: rgba(211, 47, 47, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(211, 47, 47, 0.2);">
                    <p style="font-size: 0.85rem; color: var(--danger); text-align: center; margin: 0; line-height: 1.4;">
                        <b>సూచన:</b> మీ పిన్ మర్చిపోయినట్లయితే, దయచేసి <b>వాల్యూ టీమ్ (Valiass Team)</b> ని సంప్రదించి రీసెట్ కోడ్ పొందండి.
                    </p>
                </div>

                <form id="reset-form">
                    <div class="form-group">
                        <label class="form-label">Valiass Reset Code</label>
                        <div class="input-group">
                            <i class="fas fa-shield-alt input-icon"></i>
                            <input type="text" id="reset-code" class="form-control" placeholder="వాల్యూ టీమ్ ఇచ్చిన రహస్య కోడ్" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">New 6-Digit PIN</label>
                        <div class="input-group">
                            <i class="fas fa-key input-icon"></i>
                            <input type="password" id="reset-new-pin" class="form-control pin-input" maxlength="6" inputmode="numeric" pattern="\d*" placeholder="••••••" required>
                            <button type="button" class="toggle-pin-btn" onclick="togglePinVisibility('reset-new-pin', 'reset-pin-eye-icon')">
                                <i class="fas fa-eye" id="reset-pin-eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-glow" id="reset-btn" style="margin-top: 10px;">Reset PIN</button>
                    <div style="text-align: center; margin-top: 15px;">
                        <a href="#" onclick="showLoginView()" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">Back to Login</a>
                    </div>
                </form>
            </div>

        </main>
        <footer id="app-footer" class="app-footer" style="background: transparent; border: none;"></footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script>
        UI.initLayout();
        document.getElementById('app-container').style.display = 'flex'; 

        const viewLoading = document.getElementById('view-loading');
        const viewSetup = document.getElementById('view-setup');
        const viewLogin = document.getElementById('view-login');
        const viewReset = document.getElementById('view-reset');

        // Failed Attempts Logic
        let failedAttempts = parseInt(localStorage.getItem('hm_failed_attempts') || '0');
        let lockoutUntil = parseInt(localStorage.getItem('hm_lockout_until') || '0');
        let lockoutInterval;

        function updateDotsAndText() {
            // Reset all dots
            for(let i=1; i<=5; i++) {
                document.getElementById(`dot-${i}`).classList.remove('error');
            }
            // Fill failed attempts
            for(let i=1; i<=failedAttempts; i++) {
                document.getElementById(`dot-${i}`).classList.add('error');
            }
            
            const left = 5 - failedAttempts;
            const textEl = document.getElementById('attempt-text');
            
            if (left > 0 && left < 5) {
                textEl.innerText = `${left} attempts left`;
            } else {
                textEl.innerText = '';
            }
        }

        function checkLockout() {
            const now = new Date().getTime();
            const loginBtn = document.getElementById('login-btn');
            const pinInput = document.getElementById('hm-pin');

            if (lockoutUntil > now) {
                const secondsLeft = Math.ceil((lockoutUntil - now) / 1000);
                loginBtn.disabled = true;
                loginBtn.innerHTML = `Locked (${secondsLeft}s)`;
                pinInput.disabled = true;
                
                if(!lockoutInterval) {
                    lockoutInterval = setInterval(() => {
                        const t = new Date().getTime();
                        if (lockoutUntil > t) {
                            const s = Math.ceil((lockoutUntil - t) / 1000);
                            loginBtn.innerHTML = `Locked (${s}s)`;
                        } else {
                            clearInterval(lockoutInterval);
                            lockoutInterval = null;
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = 'Login';
                            pinInput.disabled = false;
                            failedAttempts = 0;
                            localStorage.setItem('hm_failed_attempts', 0);
                            updateDotsAndText();
                        }
                    }, 1000);
                }
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login';
                pinInput.disabled = false;
            }
        }

        // Initial Check on Load
        updateDotsAndText();
        checkLockout();

        function togglePinVisibility(inputId, iconId) {
            const pinInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            if (pinInput.type === 'password') {
                pinInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pinInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showResetView() { viewLogin.style.display = 'none'; viewReset.style.display = 'block'; }
        function showLoginView() { viewReset.style.display = 'none'; viewLogin.style.display = 'block'; }

        async function checkSchoolStatus() {
            try {
                const doc = await db.collection('schoolInfo').doc('main').get();
                viewLoading.style.display = 'none';
                if (doc.exists && doc.data().isSetupComplete && doc.data().hmPin) {
                    viewLogin.style.display = 'block'; 
                } else {
                    viewSetup.style.display = 'block'; 
                }
            } catch (error) { viewLoading.innerHTML = `<p style="color:red;">Error connecting.</p>`; }
        }
        checkSchoolStatus();

        // Setup Form
        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('setup-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const secretCode = document.getElementById('valiassCode').value.trim();
            const setupPin = document.getElementById('setup-pin').value.trim();
            
            if (secretCode !== '@533340') { alert("❌ తప్పు వాల్యూ సీక్రెట్ కోడ్!"); btn.innerHTML = 'Confirm'; btn.disabled = false; return; }
            if (setupPin.length !== 6) { alert("❌ పిన్ 6 అంకెలు ఉండాలి!"); btn.innerHTML = 'Confirm'; btn.disabled = false; return; }

            try {
                await db.collection('schoolInfo').doc('main').set({
                    district: document.getElementById('district').value,
                    mandal: document.getElementById('mandal').value,
                    village: document.getElementById('village').value,
                    schoolName: "MP MPS Dagguluru",
                    hmName: document.getElementById('hmName').value,
                    valiassCode: secretCode,
                    isSetupComplete: true,
                    hmPin: setupPin,
                    sections: { teacher: false, cook: false, parent: false, office: false },
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ Setup Successful! Please login.");
                viewSetup.style.display = 'none';
                viewLogin.style.display = 'block'; 
            } catch (error) { alert("❌ Failed: " + error.message); btn.innerHTML = 'Confirm'; btn.disabled = false; }
        });

        // Login Form with Security
        document.getElementById('hm-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // చెక్: లాక్ అయ్యి ఉంటే ఆపేయాలి
            if (lockoutUntil > new Date().getTime()) return;

            const pin = document.getElementById('hm-pin').value;
            const btn = document.getElementById('login-btn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            btn.disabled = true;

            const result = await Auth.loginHM(pin);
            
            if (result.success) { 
                localStorage.setItem('hm_failed_attempts', 0); // సక్సెస్ అయ్యాక రీసెట్
                localStorage.removeItem('hm_lockout_until');
                window.location.href = 'hm-dashboard.html'; 
            } 
            else { 
                failedAttempts++;
                localStorage.setItem('hm_failed_attempts', failedAttempts);
                document.getElementById('hm-pin').value = '';
                updateDotsAndText();

                if (failedAttempts >= 5) {
                    lockoutUntil = new Date().getTime() + 60000; // 60 సెకన్లు
                    localStorage.setItem('hm_lockout_until', lockoutUntil);
                    alert("❌ 5 తప్పు ప్రయత్నాలు! 60 సెకన్ల పాటు లాక్ చేయబడింది.");
                    checkLockout();
                } else {
                    alert("❌ " + result.message);
                    btn.innerHTML = 'Login';
                    btn.disabled = false;
                }
            }
        });

        // Reset PIN Form
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reset-btn');
            const resetCode = document.getElementById('reset-code').value.trim();
            const newPin = document.getElementById('reset-new-pin').value.trim();

            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yy = String(today.getFullYear()).slice(-2);
            const ddmmyy = parseInt(dd + mm + yy);
            
            const expectedCode = String(919720 - ddmmyy);

            if (resetCode !== expectedCode) {
                alert(`❌ తప్పు రీసెట్ కోడ్!\nదయచేసి వాల్యూ టీమ్ ఇచ్చిన కోడ్ సరిగ్గా ఉందో లేదో చెక్ చేయండి.`);
                return;
            }

            if (newPin.length !== 6) { alert("❌ కొత్త పిన్ 6 అంకెలు ఉండాలి!"); return; }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
            btn.disabled = true;

            try {
                await db.collection('schoolInfo').doc('main').update({ hmPin: newPin });
                alert("✅ PIN విజయవంతంగా రీసెట్ అయ్యింది! కొత్త పిన్ తో లాగిన్ అవ్వండి.");
                
                // రీసెట్ అయ్యాక ఫెయిల్డ్ అటెంప్ట్స్ క్లియర్ చేయాలి
                localStorage.setItem('hm_failed_attempts', 0);
                localStorage.removeItem('hm_lockout_until');
                failedAttempts = 0;
                updateDotsAndText();

                showLoginView();
                btn.innerHTML = 'Reset PIN';
                btn.disabled = false;
            } catch (error) {
                alert("❌ Error: " + error.message);
                btn.innerHTML = 'Reset PIN';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
