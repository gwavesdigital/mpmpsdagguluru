<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MP MPS Dagguluru - Digital Manabadi</title>
    <meta name="theme-color" content="#1B5E20">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="not-logged-in">

    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <img src="https://cdn-icons-png.flaticon.com/512/3976/3976625.png" alt="School Logo" class="splash-logo">
        <h2>MP MPS Dagguluru</h2>
        <p>Digital Manabadi</p>
    </div>

    <div class="app-container" id="app-container" style="display: none;">
        <header id="app-header" class="app-header"></header>

        <main class="main-content">
            <!-- PWA Install Button -->
            <button id="install-app-btn" class="btn btn-outline" style="margin-bottom: var(--space-lg); display: none;">
                <i class="fas fa-download" style="margin-right: 8px;"></i> Install App
            </button>

            <!-- 5 Sections Grid -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
                
                <!-- Headmaster -->
                <div onclick="checkAccess('headmaster')" class="card" style="text-align: center; cursor: pointer;">
                    <div style="font-size: 2.5rem; color: var(--primary); margin-bottom: var(--space-sm);"><i class="fas fa-user-tie"></i></div>
                    <h3 style="font-size: 1.1rem; margin-bottom: 2px;">Headmaster</h3>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">ప్రిన్సిపాల్</p>
                </div>

                <!-- Teacher -->
                <div onclick="checkAccess('teacher')" class="card" style="text-align: center; cursor: pointer;">
                    <div style="font-size: 2.5rem; color: var(--primary); margin-bottom: var(--space-sm);"><i class="fas fa-chalkboard-teacher"></i></div>
                    <h3 style="font-size: 1.1rem; margin-bottom: 2px;">Teacher</h3>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">ఉపాధ్యాయుడు</p>
                </div>

                <!-- Cook -->
                <div onclick="checkAccess('cook')" class="card" style="text-align: center; cursor: pointer;">
                    <div style="font-size: 2.5rem; color: var(--primary); margin-bottom: var(--space-sm);"><i class="fas fa-utensils"></i></div>
                    <h3 style="font-size: 1.1rem; margin-bottom: 2px;">Cook</h3>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">వంటవాడు</p>
                </div>

                <!-- Parent -->
                <div onclick="checkAccess('parent')" class="card" style="text-align: center; cursor: pointer;">
                    <div style="font-size: 2.5rem; color: var(--primary); margin-bottom: var(--space-sm);"><i class="fas fa-users"></i></div>
                    <h3 style="font-size: 1.1rem; margin-bottom: 2px;">Parent</h3>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">తల్లిదండ్రులు</p>
                </div>

                <!-- Office (Coming Soon) -->
                <div class="card" style="text-align: center; opacity: 0.7; grid-column: span 2;">
                    <div style="font-size: 2rem; color: var(--text-muted); margin-bottom: var(--space-xs);"><i class="fas fa-building"></i></div>
                    <h3 style="font-size: 1.1rem; margin-bottom: 2px;">Office Section</h3>
                    <p style="font-size: 0.8rem; color: var(--danger);">Coming Soon</p>
                </div>
            </div>

            <!-- Font Size Controls -->
            <div style="margin-top: var(--space-xl); display: flex; justify-content: center; align-items: center;">
                <div style="display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border-color); border-radius: 50px; padding: 4px; box-shadow: var(--shadow-sm);">
                    <span style="font-size: 0.9rem; color: var(--text-muted); padding: 0 12px; font-weight: 600;">Aa</span>
                    <button class="header-btn" onclick="UI.changeFontSize('decrease')" style="border-radius: 50%; width: 36px; height: 36px; background: var(--bg-color); color: var(--text-main); font-size: 1rem;">A-</button>
                    <button class="header-btn" onclick="UI.changeFontSize('increase')" style="border-radius: 50%; width: 36px; height: 36px; background: var(--primary); color: white; font-size: 1rem; margin-left: 4px;">A+</button>
                </div>
            </div>
        </main>

        <footer id="app-footer" class="app-footer"></footer>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
